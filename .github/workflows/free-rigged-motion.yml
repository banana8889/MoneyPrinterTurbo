name: Free Rigged Character Motion
on:
  push:
    branches: [autonomy-kids-v1]
    paths:
      - "studio/rigged_pilot.py"
      - ".github/workflows/free-rigged-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-proof:
    # Standard GitHub-hosted runner in a PUBLIC repo; no premium runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install free Blender and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender ffmpeg python3-numpy
          blender --version | head -3
          ffmpeg -version | head -1

      - name: Render a short skeletal-motion smoke sample
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OMP_NUM_THREADS: "2"
        run: |
          mkdir -p out
          blender -b -t 2 --python-exit-code 3 --python studio/rigged_pilot.py -- --smoke --seconds 2 --fps 24 --out out/rigged_motion.mp4

      - name: Verify artifact and evidence
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          path=pathlib.Path("out/rigged_motion.mp4")
          assert path.is_file() and path.stat().st_size > 1000
          r=json.loads(pathlib.Path("out/rigged_motion.report.json").read_text())
          assert r["has_actual_armature"]
          assert r["animation_actions"] == ["run", "survey", "walk"]
          assert r["cinematic_release_pass"] is False
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(path)]))
          video=next(x for x in info["streams"] if x["codec_type"]=="video")
          assert int(video["width"])>=640 and int(video["height"])>=360
          assert video["r_frame_rate"]=="24/1", video
          print(json.dumps({"render":"pass","size":path.stat().st_size,"width":video["width"],"height":video["height"]}))
          PY

      - name: Share video and inspection files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-rigged-motion-smoke
          path: |
            out/*.mp4
            out/*.report.json
            out/*.CREDITS.txt
            out/*.blend
          retention-days: 3
          if-no-files-found: warn
